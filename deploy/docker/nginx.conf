# nginx in front of cypher.
#   :80   — redirect to https; Let's Encrypt HTTP-01 checks go to cypher.
#   :8080 — the cover website (internal); cypher on :443 sends everyone
#           without a valid key here, so the server looks like plain nginx.
server {
    # IPv4 only: IPv6 is disabled inside Docker containers by default.
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        proxy_pass http://cypher:8081;
        proxy_set_header Host $host;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # Real visitors reach this through cypher; keep their address in logs.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    location / {
        try_files $uri $uri/ =404;
    }
}
