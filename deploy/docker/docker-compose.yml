# cypher server in Docker, with nginx in front.
#
#   1. Point your domain (A record) at this server; open TCP ports 80 and 443.
#   2. echo "CYPHER_DOMAIN=example.com" > .env   (optionally CYPHER_EMAIL=you@example.com)
#   3. docker compose up -d && docker compose logs cypher   ← the client link is printed here
#   Relay in Russia: also put CYPHER_UPSTREAM=<link of a user on the exit> into .env
#
# cypher gets the Let's Encrypt certificate itself (no certbot) and renews it
# automatically 30 days before expiry, without a restart.
# Port 80: nginx (redirect to https, Let's Encrypt checks).
# Port 443: cypher; everyone without a key sees the site from ./site via nginx.
name: cypher

services:
  cypher:
    image: ghcr.io/ddday9/cypher:latest
    # To build on the server instead of pulling: docker compose build
    build:
      context: ../..
    container_name: cypher
    restart: unless-stopped
    ports:
      - "443:8443/tcp"
    environment:
      CYPHER_DOMAIN: ${CYPHER_DOMAIN:?set CYPHER_DOMAIN in .env}
      CYPHER_EMAIL: ${CYPHER_EMAIL:-}
      CYPHER_ACME_HTTP: ":8081"
      CYPHER_FALLBACK_PROXY: "http://nginx:8080"
      # 1 = the server refuses Russian sites, so its IP is not seen on them
      # (clients send Russian traffic directly by default anyway).
      CYPHER_BLOCK_RU: ${CYPHER_BLOCK_RU:-0}
      # Relay mode (a server in Russia in front of the exit abroad): a
      # cypher:// link of a user on the exit server. Russian sites leave from
      # here, everything else goes through the exit (geosite/geoip rules).
      CYPHER_UPSTREAM: ${CYPHER_UPSTREAM:-}
    volumes:
      # Config, user keys and the certificate.
      - cypher-data:/etc/cypher
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:stable-alpine
    container_name: cypher-nginx
    restart: unless-stopped
    ports:
      - "80:80/tcp"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The cover website. Replace index.html with your own site.
      - ./site:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging: *logging

volumes:
  cypher-data:
