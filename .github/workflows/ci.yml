name: ci
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -race ./...
      - run: GOOS=windows go build -o /dev/null ./cmd/nevio

  # A real Wintun adapter on Windows (the runner has administrator rights):
  # the "Весь трафик (TUN)" mode of nevio.
  windows-tun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash
          if ($hash -ne "07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51") { throw "wintun.zip hash $hash" }
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll C:\Windows\System32\
      - name: TUN test
        shell: bash
        env:
          CYPHER_TUN_TEST: "1"
        run: go test -count=1 -run 'TestWindowsTUN|TestTunnel|TestRelay' -v ./internal/app/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the APK
        run: |
          set -euo pipefail
          { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          make android
          (cd android && ./gradlew --no-daemon lintRelease)
