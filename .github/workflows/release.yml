name: release
# Push a tag like v0.1.0, or run this workflow by hand with a version, to
# build everything and publish a GitHub release plus the server image
# ghcr.io/<owner>/cypher. A manual run creates the tag on the current commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version: $VERSION"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && GOOS=windows go vet ./...
      - run: go test -race ./...

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Command-line binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            # Unversioned names keep releases/latest/download/<name> links stable.
            name="cypher-$os-$arch"
            out="build/$name"
            mkdir -p "$out"
            ext=""; [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "$out/cypher$ext" ./cmd/cypher
            cp -r examples docs "$out/"
            cp README.md "$out/"
            if [ "$os" = linux ]; then
              cp -r deploy "$out/"
              tar -C build -czf "dist/$name.tar.gz" "$name"
            else
              (cd build && zip -qr "../dist/$name.zip" "$name")
            fi
          done

      - name: Desktop client (Windows)
        run: |
          set -euo pipefail
          # Icon and manifest for the executable.
          (cd cmd/nevio && go run github.com/tc-hib/go-winres@v0.3.3 simply \
            --icon assets/app.ico --manifest gui --arch amd64 \
            --product-name nevio --file-description "nevio VPN client" \
            --original-filename nevio.exe --file-version "${VERSION#v}" --product-version "${VERSION#v}")
          make gui VERSION="$VERSION"
          cp bin/nevio.exe "dist/nevio-windows-amd64.exe"

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat > notes.md <<NOTES
          ## nevio — клиент для Windows
          \`nevio-windows-amd64.exe\` — графический клиент (Wintun встроен). Положите в отдельную папку и запустите.

          ## Сервер в Docker
          \`\`\`
          docker pull ghcr.io/$owner/cypher:$VERSION
          \`\`\`
          Инструкция: [docs/docker.md](https://github.com/$GITHUB_REPOSITORY/blob/$VERSION/docs/docker.md).

          ## Документация
          * [Сервер и ретранслятор — все настройки](https://github.com/$GITHUB_REPOSITORY/blob/$VERSION/docs/server.md)
          * [Клиент (nevio и консольный) — все настройки](https://github.com/$GITHUB_REPOSITORY/blob/$VERSION/docs/client.md)
          * [Ретранслятор в России](https://github.com/$GITHUB_REPOSITORY/blob/$VERSION/docs/relay.md)

          ## Остальное
          * \`cypher-linux-*.tar.gz\` — бинарник, скрипты \`deploy/\` (docker-compose с nginx, systemd), примеры конфигов, документация \`docs/\`.
          * \`cypher-windows-amd64.zip\` — консольный клиент, примеры, документация.
          * \`SHA256SUMS\` — контрольные суммы.
          NOTES
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            # On a manual run the tag does not exist yet: create it on this commit.
            gh release create "$VERSION" dist/* --title "cypher $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cypher" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ env.VERSION }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
